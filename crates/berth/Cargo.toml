[package]
name = "berth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "berth inference server"

[dependencies]
berth-engine = { path = "../berth-engine" }
berth-repetition = { path = "../berth-repetition" }
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
minijinja = { version = "3", features = ["serde", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
berth-engine = { path = "../berth-engine" }
